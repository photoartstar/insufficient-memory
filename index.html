<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insufficient Memory</title>
<link rel="stylesheet" href="cesium/Widgets/widgets.css">
<style>
  :root {
    --panel-w: 400px;
    --ink: #202124;
    --muted: #5f6368;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--font); }

  /* The stage holds the live globe and, on landing, the Google Earth / Street View still on top of it.
     Both share one box (window minus the story panel) so their framing lines up. */
  #stage { position: absolute; top: 0; left: 0; bottom: 0; right: 0; overflow: hidden; transition: right .35s ease; }
  #stage.shift { right: var(--panel-w); }
  #globe { position: absolute; inset: 0; }
  #globe .cesium-viewer-bottom, #globe .cesium-widget-credits { display: none !important; }
  #still { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  #still.on { pointer-events: auto; cursor: grab; }
  #still img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;
    opacity: 0; transition: opacity var(--fade, 900ms) ease-in-out; }
  #still img.on { opacity: 1; }
  #back { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 8; display: none;
    background: rgba(255,255,255,.95); color: var(--ink); border: 0; border-radius: 20px; padding: 9px 16px; font: 13px var(--font);
    box-shadow: 0 2px 8px rgba(0,0,0,.35); cursor: pointer; }
  #back.show { display: block; }

  #header { position: absolute; left: 16px; top: 12px; color: #fff; z-index: 5; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #header .t { font-size: 20px; font-weight: 400; }
  #header .a { font-size: 13px; opacity: .9; margin-top: 2px; }

  /* Right story panel, as in the Earth story mode */
  #panel { position: absolute; top: 0; right: 0; bottom: 0; width: var(--panel-w); background: #fff; color: var(--ink);
    z-index: 6; display: flex; flex-direction: column; box-shadow: -2px 0 12px rgba(0,0,0,.25);
    transform: translateX(0); transition: transform .35s ease; }
  #panel.hidden { transform: translateX(calc(var(--panel-w) + 20px)); }
  #panel .bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 16px; }
  #panel .bar .pin { width: 20px; height: 20px; flex: none; }
  #panel .bar .name { flex: 1; font-weight: 500; }
  #panel .scroll { overflow-y: auto; flex: 1; }
  #panel .photo { width: 100%; display: block; background: #2a2a2a; }
  #panel .photo img { width: 100%; display: block; max-height: 62vh; object-fit: contain; background: #2a2a2a; }
  #panel .photo.placeholder { aspect-ratio: 4 / 3; }
  #panel .body { padding: 18px 20px 40px; font-size: 14px; line-height: 1.55; }
  #panel .body p { margin: 0 0 14px; }
  #panel .body a { color: #1a73e8; word-break: break-all; }
  #panel .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

  /* Intro */
  #intro { position: absolute; inset: 0; z-index: 7; background: #1f2124; color: #fff; display: flex; align-items: center;
    transition: opacity .6s ease; }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro .bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .55; }
  #intro .inner { position: relative; max-width: 820px; padding: 40px 32px 90px; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #intro h1 { font-weight: 400; font-size: 34px; margin: 0 0 18px; }
  #intro p { font-size: 15px; line-height: 1.6; margin: 0 0 14px; }
  #intro a { color: #8ab4f8; }

  /* Bottom-left controls */
  #controls { position: absolute; left: 12px; bottom: 12px; z-index: 8; display: flex; align-items: center;
    background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.35); height: 44px; color: var(--ink); }
  #controls button { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; height: 44px; padding: 0 12px;
    display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #controls button:hover { background: #f1f3f4; }
  #controls .sep { width: 1px; height: 26px; background: #dadce0; }
  #controls .count { font-size: 13px; min-width: 52px; text-align: center; }
  #controls svg { width: 20px; height: 20px; fill: var(--ink); }
  #controls button.nav { padding: 0 8px; }

  #toc { position: absolute; left: 12px; bottom: 64px; width: 360px; max-height: 60vh; background: #fff; border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.35); z-index: 8; overflow-y: auto; display: none; }
  #toc.open { display: block; }
  #toc .item { display: flex; align-items: center; gap: 12px; padding: 9px 14px; cursor: pointer; font-size: 13px; color: var(--ink); }
  #toc .item:hover { background: #f1f3f4; }
  #toc .item.current { background: #fef7e0; }
  #toc .item .n { color: var(--muted); font-size: 12px; min-width: 22px; text-align: right; }
  #toc .item svg { width: 18px; height: 18px; fill: var(--muted); flex: none; }
  #toc .item .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toc .item .lbl.street { color: var(--muted); }

  #attrib { position: absolute; right: 12px; bottom: 10px; z-index: 5; color: #fff; font-size: 11px; opacity: .85;
    text-shadow: 0 1px 2px rgba(0,0,0,.8); transition: right .35s ease; }
  #attrib.shift { right: calc(var(--panel-w) + 12px); }

  @media (max-width: 760px) {
    :root { --panel-w: 100vw; }
    #stage.shift { right: 0; bottom: 55%; }
    #panel { top: 45%; width: 100vw; }
    #attrib.shift { right: 12px; }
    #toc { width: calc(100vw - 24px); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="globe"></div>
  <div id="still"><img id="imgA" alt=""><img id="imgB" alt=""></div>
</div>
<button id="back">Back to the street view</button>

<div id="header"><div class="t" id="hTitle"></div><div class="a" id="hAuthor"></div></div>

<div id="panel" class="hidden">
  <div class="bar">
    <svg class="pin" viewBox="0 0 24 24"><path fill="#fbc02d" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"/><circle cx="12" cy="9" r="2.6" fill="#7a5a00"/></svg>
    <div class="name" id="pName"></div>
  </div>
  <div class="scroll">
    <div class="photo" id="pPhoto"></div>
    <div class="body"><div class="subtitle" id="pSub"></div><div id="pText"></div></div>
  </div>
</div>

<div id="intro"><div class="bg" id="iBg"></div><div class="inner"><h1 id="iTitle"></h1><div id="iText"></div></div></div>

<div id="toc"></div>

<div id="controls">
  <button id="btnToc" title="Table of contents">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    <span>Table of contents</span>
  </button>
  <div class="sep"></div>
  <button class="nav" id="btnPrev" title="Previous"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
  <div class="count" id="count">1/1</div>
  <button class="nav" id="btnNext" title="Next"><svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
</div>

<div id="attrib">Globe: CesiumJS over USGS public-domain imagery &middot; Street level: Google Street View stills, September 2026 &middot; Photographs: Sean Fader</div>

<script>window.CESIUM_BASE_URL = 'cesium/';</script>
<script src="cesium/Cesium.js"></script>
<script src="config.js"></script>
<script src="stops.js"></script>
<script>
(function () {
  const CFG = Object.assign({ stills: 'stills_web', fade: 1200, autoplay: 0, tiles: 'remote', maxZoom: 19, flight: 1.5, groundFade: 0.4, groundFadeMs: 650 }, window.IM_CONFIG || {});
  const DATA = window.IM_DATA;
  const stops = DATA.stops.filter(s => !s.hidden);
  const C = Cesium;
  const $ = id => document.getElementById(id);
  document.documentElement.style.setProperty('--fade', CFG.fade + 'ms');
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- Globe (the flights) ----------
  const imagery = new C.UrlTemplateImageryProvider({
    url: CFG.tiles === 'local' ? 'tiles/{z}/{y}/{x}.jpg'
       : 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}',
    maximumLevel: CFG.maxZoom, credit: 'USGS The National Map'
  });
  const viewer = new C.Viewer('globe', {
    baseLayer: new C.ImageryLayer(imagery), terrainProvider: new C.EllipsoidTerrainProvider(),
    animation: false, timeline: false, baseLayerPicker: false, geocoder: false, homeButton: false,
    sceneModePicker: false, navigationHelpButton: false, fullscreenButton: false, infoBox: false,
    selectionIndicator: false, vrButton: false, shouldAnimate: true, requestRenderMode: false
  });
  const scene = viewer.scene, camera = viewer.camera;
  scene.globe.enableLighting = false;
  scene.globe.showGroundAtmosphere = true;
  scene.skyAtmosphere.show = true;
  scene.globe.baseColor = C.Color.fromCssColorString('#0b1a2e');
  scene.screenSpaceCameraController.enableCollisionDetection = true;
  scene.screenSpaceCameraController.minimumZoomDistance = 30;
  viewer.resolutionScale = Math.min(window.devicePixelRatio || 1, 2);

  // Google Earth's vertical field of view is 35 degrees; keep it whatever the stage's shape
  function setVerticalFov(deg) {
    const aspect = Math.max(0.2, scene.canvas.clientWidth / Math.max(1, scene.canvas.clientHeight));
    const v = C.Math.toRadians(deg);
    camera.frustum.fov = aspect >= 1 ? 2 * Math.atan(aspect * Math.tan(v / 2)) : v;
  }
  setVerticalFov(35);
  new ResizeObserver(() => { viewer.resize(); setVerticalFov(35); }).observe($('globe'));

  const SPACE_VIEW = { destination: C.Cartesian3.fromDegrees(-97, 36, 20000000), orientation: { heading: 0, pitch: -C.Math.PI_OVER_TWO, roll: 0 } };
  camera.setView(SPACE_VIEW);

  // pins for every site
  const pinUrl = new C.PinBuilder().fromColor(C.Color.fromCssColorString('#fbc02d'), 40).toDataURL();
  const entityByIndex = {};
  stops.forEach((s, i) => {
    if (s.kind !== 'story' || s.lon == null) return;
    entityByIndex[i] = viewer.entities.add({
      position: C.Cartesian3.fromDegrees(s.lon, s.lat, 0),
      billboard: { image: pinUrl, verticalOrigin: C.VerticalOrigin.BOTTOM, scale: 0.7,
        scaleByDistance: new C.NearFarScalar(2.0e5, 1.0, 1.5e7, 0.5), disableDepthTestDistance: 5000 },
      label: { text: s.name, font: '500 13px ' + getComputedStyle(document.body).fontFamily,
        fillColor: C.Color.WHITE, outlineColor: C.Color.BLACK.withAlpha(0.9), outlineWidth: 4,
        style: C.LabelStyle.FILL_AND_OUTLINE, verticalOrigin: C.VerticalOrigin.BOTTOM,
        pixelOffset: new C.Cartesian2(0, -30), distanceDisplayCondition: new C.DistanceDisplayCondition(0, 5.5e6),
        disableDepthTestDistance: 5000 }
    });
  });

  function lookAtToCamera(la) {
    const t = C.Math.toRadians(la.tilt || 0), h = C.Math.toRadians(la.heading || 0);
    const target = C.Cartesian3.fromDegrees(la.lon, la.lat, 0);
    const enu = C.Transforms.eastNorthUpToFixedFrame(target);
    const off = new C.Cartesian3(-Math.sin(t) * Math.sin(h) * la.range, -Math.sin(t) * Math.cos(h) * la.range, Math.cos(t) * la.range);
    return { destination: C.Matrix4.multiplyByPoint(enu, off, new C.Cartesian3()),
             orientation: { heading: h, pitch: -(C.Math.PI_OVER_TWO - t), roll: 0 } };
  }
  // the ground position a street stop descends to: low over the street, looking along the Street View heading
  function streetToCamera(cam) {
    const h = C.Math.toRadians(cam.heading || 0), height = 40, pitchDeg = -24;
    const back = height / Math.tan(C.Math.toRadians(-pitchDeg));
    const target = C.Cartesian3.fromDegrees(cam.lon, cam.lat, 0);
    const enu = C.Transforms.eastNorthUpToFixedFrame(target);
    const off = new C.Cartesian3(-Math.sin(h) * back, -Math.cos(h) * back, height);
    return { destination: C.Matrix4.multiplyByPoint(enu, off, new C.Cartesian3()),
             orientation: { heading: h, pitch: C.Math.toRadians(pitchDeg), roll: 0 } };
  }
  function flyDuration(dest) {
    const d = C.Cartesian3.distance(camera.positionWC, dest);
    return CFG.flight * Math.max(2.5, Math.min(9, 2 + d / 1.0e6));
  }
  // resolves when the flight lands (or is cancelled by a newer one)
  function fly(view, duration, easing) {
    return new Promise(res => {
      camera.cancelFlight();
      camera.flyTo(Object.assign({ duration: duration || flyDuration(view.destination), complete: () => res(true), cancel: () => res(false),
                                   easingFunction: easing || C.EasingFunction.QUINTIC_IN_OUT }, view));
    });
  }

  // ---------- Stills (the landings) ----------
  const stillBox = $('still'), layers = [$('imgA'), $('imgB')];
  let front = 0, stillShown = false;
  function load(src) { return new Promise(r => { const im = new Image(); im.onload = () => r(true); im.onerror = () => r(false); im.src = src; }); }
  async function showStill(src, ms) {
    const back = layers[1 - front];
    await load(src); back.src = src;
    const f = ms != null ? ms : CFG.fade;
    layers.forEach(l => l.style.transitionDuration = f + 'ms');
    back.classList.add('on'); layers[front].classList.remove('on');
    front = 1 - front; stillShown = true; stillBox.classList.add('on'); $('back').classList.remove('show');
    await sleep(f);
  }
  function hideStill(ms) {
    layers.forEach(l => { l.style.transitionDuration = (ms != null ? ms : CFG.fade) + 'ms'; l.classList.remove('on'); });
    stillShown = false; stillBox.classList.remove('on');
  }
  const stillUrl = s => s.still ? CFG.stills + '/' + s.still : '';

  // A drag or scroll on the still hands the globe to the visitor; the button brings the picture back.
  let dragStart = null;
  stillBox.addEventListener('pointerdown', e => { dragStart = [e.clientX, e.clientY]; });
  stillBox.addEventListener('pointermove', e => {
    if (dragStart && Math.hypot(e.clientX - dragStart[0], e.clientY - dragStart[1]) > 8) { dragStart = null; explore(); }
  });
  stillBox.addEventListener('pointerup', () => { dragStart = null; });
  stillBox.addEventListener('wheel', () => explore(), { passive: true });
  function explore() { if (!stillShown) return; hideStill(500); $('back').classList.add('show'); }
  // the 'story' stops have no picture over the globe, so the globe is always live there
  $('back').addEventListener('click', () => { const s = stops[cur]; if (s.kind === 'street') { fly(viewFor(s)).then(ok => { if (ok) showStill(stillUrl(s)); }); } });

  // ---------- UI ----------
  $('hTitle').textContent = DATA.title; $('hAuthor').textContent = DATA.author;
  const intro = stops[0];
  $('iTitle').textContent = intro.name; $('iText').innerHTML = intro.html;
  if (intro.photo) $('iBg').style.backgroundImage = 'url(' + intro.photo + ')';

  let cur = 0, seq = 0;
  const labelFor = s => s.kind === 'street' ? (s.for || s.name) + ' — street level' : s.name;
  const toc = $('toc');
  const pinSvg = '<svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>';
  const eyeSvg = '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>';
  stops.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'item'; el.dataset.i = i;
    el.innerHTML = '<span class="n">' + (i + 1) + '</span>' + (s.kind === 'street' ? eyeSvg : pinSvg) +
      '<span class="lbl' + (s.kind === 'street' ? ' street' : '') + '">' + (i === 0 ? s.name + ' (introduction)' : labelFor(s)) + '</span>';
    el.addEventListener('click', () => { go(i); toc.classList.remove('open'); });
    toc.appendChild(el);
  });

  function renderPanel(s) {
    $('pName').textContent = s.name;
    const ph = $('pPhoto');
    if (s.photo) { ph.className = 'photo'; ph.innerHTML = '<img src="' + s.photo + '" alt="">'; }
    else { ph.className = 'photo placeholder'; ph.innerHTML = ''; }
    $('pSub').textContent = s.subtitle || '';
    $('pSub').style.display = s.subtitle ? '' : 'none';
    let html = s.html || '';
    if (s.subtitle) html = html.replace(/^<p>.*?<\/p>/s, '');
    $('pText').innerHTML = html;
    $('panel').querySelector('.scroll').scrollTop = 0;
  }
  function setPanel(open) {
    $('panel').classList.toggle('hidden', !open);
    $('stage').classList.toggle('shift', open);
    $('attrib').classList.toggle('shift', open);
  }
  // the aerial camera of a stop; a street stop shares its site's aerial camera
  function viewFor(s) {
    if (s.kind === 'story' && s.lookat) return lookAtToCamera(s.lookat);
    if (s.kind === 'street' && s.camera) return streetToCamera(s.camera);
    return SPACE_VIEW;
  }

  async function go(i) {
    const prev = stops[cur];
    cur = Math.max(0, Math.min(stops.length - 1, i));
    const s = stops[cur];
    const my = ++seq;
    $('count').textContent = (cur + 1) + '/' + stops.length;
    toc.querySelectorAll('.item').forEach(el => el.classList.toggle('current', +el.dataset.i === cur));
    history.replaceState(null, '', '#' + (cur + 1));
    $('back').classList.remove('show');
    scheduleAutoplay();

    if (s.kind === 'intro') {
      $('intro').classList.remove('hidden'); setPanel(false); hideStill(600);
      fly(SPACE_VIEW);
      return;
    }
    $('intro').classList.add('hidden');

    if (s.kind === 'street') {
      // descend from the aerial view toward the ground; the Street View picture fades in on the way down
      // and is fully there just before the camera would reach the ground position
      setPanel(false);
      const view = streetToCamera(s.camera);
      const dur = Math.max(2.5, 3.2 * CFG.flight);
      // the fade starts partway down: CFG.groundFade is the fraction of the descent still to go when it begins
      const lead = Math.min(dur * 1000 - 300, Math.max(CFG.groundFadeMs, dur * 1000 * CFG.groundFade));   // groundFade 0: the fade ends exactly as the camera stops
      await load(stillUrl(s));
      if (my !== seq) return;
      const flight = fly(view, dur, C.EasingFunction.CUBIC_IN_OUT);      // gentler ease: the camera keeps drifting until the end
      setTimeout(() => { if (my === seq) showStill(stillUrl(s), CFG.groundFadeMs); }, dur * 1000 - lead);
      await flight;
      return;
    }

    // a story stop: lift off (the picture fades away as the camera climbs), fly, land on the aerial view
    renderPanel(s); setPanel(true);
    hideStill(700);
    const ok = await fly(lookAtToCamera(s.lookat));
    if (!ok || my !== seq) return;
    const nxt = stops[cur + 1]; if (nxt && nxt.still) load(stillUrl(nxt));   // warm the ground picture
  }

  // ---------- autoplay for the gallery ----------
  let apTimer = null, pausedUntil = 0;
  function scheduleAutoplay() {
    clearTimeout(apTimer);
    if (!CFG.autoplay) return;
    const wait = Math.max(CFG.autoplay * 1000, pausedUntil - Date.now());
    apTimer = setTimeout(() => go(cur + 1 < stops.length ? cur + 1 : 0), wait);
  }
  function interacted() { pausedUntil = Date.now() + 60000; scheduleAutoplay(); }
  ['click', 'keydown', 'touchstart', 'wheel'].forEach(ev => document.addEventListener(ev, interacted, { passive: true }));

  $('btnPrev').addEventListener('click', () => go(cur - 1));
  $('btnNext').addEventListener('click', () => go(cur + 1));
  $('btnToc').addEventListener('click', () => toc.classList.toggle('open'));
  $('intro').addEventListener('click', e => { if (e.target.tagName !== 'A') go(1); });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { go(cur + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { go(cur - 1); e.preventDefault(); }
    if (e.key === 'Escape') toc.classList.remove('open');
  });
  // clicking a pin on the globe jumps to that site
  new C.ScreenSpaceEventHandler(scene.canvas).setInputAction(m => {
    const picked = scene.pick(m.position);
    if (C.defined(picked) && picked.id) { const k = Object.keys(entityByIndex).find(k => entityByIndex[k] === picked.id); if (k != null) go(+k); }
  }, C.ScreenSpaceEventType.LEFT_CLICK);

  const h = parseInt(location.hash.slice(1), 10);
  go(Number.isFinite(h) ? h - 1 : 0);
  window.IM = { viewer, go, stops, cfg: CFG, viewFor, fly, showStill, hideStill };
})();
</script>
</body>
</html>
