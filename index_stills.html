<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insufficient Memory</title>
<style>
  :root {
    --panel-w: 400px;
    --ink: #202124;
    --muted: #5f6368;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--font); }

  /* Stage: the Google Earth / Street View still, two layers for crossfades */
  #stage { position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: #000; overflow: hidden;
    transition: right .35s ease; }
  #stage.shift { right: var(--panel-w); }
  #stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;
    opacity: 0; transition: opacity var(--fade, 900ms) ease-in-out; }
  #stage img.on { opacity: 1; }

  #header { position: absolute; left: 16px; top: 12px; color: #fff; z-index: 5; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #header .t { font-size: 20px; font-weight: 400; }
  #header .a { font-size: 13px; opacity: .9; margin-top: 2px; }

  /* Right story panel, as in the Earth story mode */
  #panel { position: absolute; top: 0; right: 0; bottom: 0; width: var(--panel-w); background: #fff; color: var(--ink);
    z-index: 6; display: flex; flex-direction: column; box-shadow: -2px 0 12px rgba(0,0,0,.25);
    transform: translateX(0); transition: transform .35s ease; }
  #panel.hidden { transform: translateX(calc(var(--panel-w) + 20px)); }
  #panel .bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 16px; }
  #panel .bar .pin { width: 20px; height: 20px; flex: none; }
  #panel .bar .name { flex: 1; font-weight: 500; }
  #panel .scroll { overflow-y: auto; flex: 1; }
  #panel .photo { width: 100%; display: block; background: #2a2a2a; }
  #panel .photo img { width: 100%; display: block; max-height: 62vh; object-fit: contain; background: #2a2a2a; }
  #panel .photo.placeholder { aspect-ratio: 4 / 3; }
  #panel .body { padding: 18px 20px 40px; font-size: 14px; line-height: 1.55; }
  #panel .body p { margin: 0 0 14px; }
  #panel .body a { color: #1a73e8; word-break: break-all; }
  #panel .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

  /* Intro */
  #intro { position: absolute; inset: 0; z-index: 7; background: #1f2124; color: #fff; display: flex; align-items: center;
    transition: opacity .6s ease; }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro .bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .55; }
  #intro .inner { position: relative; max-width: 820px; padding: 40px 32px 90px; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #intro h1 { font-weight: 400; font-size: 34px; margin: 0 0 18px; }
  #intro p { font-size: 15px; line-height: 1.6; margin: 0 0 14px; }
  #intro a { color: #8ab4f8; }

  /* Bottom-left controls */
  #controls { position: absolute; left: 12px; bottom: 12px; z-index: 8; display: flex; align-items: center;
    background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.35); height: 44px; color: var(--ink); }
  #controls button { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; height: 44px; padding: 0 12px;
    display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #controls button:hover { background: #f1f3f4; }
  #controls .sep { width: 1px; height: 26px; background: #dadce0; }
  #controls .count { font-size: 13px; min-width: 52px; text-align: center; }
  #controls svg { width: 20px; height: 20px; fill: var(--ink); }
  #controls button.nav { padding: 0 8px; }

  #toc { position: absolute; left: 12px; bottom: 64px; width: 360px; max-height: 60vh; background: #fff; border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.35); z-index: 8; overflow-y: auto; display: none; }
  #toc.open { display: block; }
  #toc .item { display: flex; align-items: center; gap: 12px; padding: 9px 14px; cursor: pointer; font-size: 13px; color: var(--ink); }
  #toc .item:hover { background: #f1f3f4; }
  #toc .item.current { background: #fef7e0; }
  #toc .item .n { color: var(--muted); font-size: 12px; min-width: 22px; text-align: right; }
  #toc .item svg { width: 18px; height: 18px; fill: var(--muted); flex: none; }
  #toc .item .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toc .item .lbl.street { color: var(--muted); }

  #attrib { position: absolute; right: 12px; bottom: 10px; z-index: 5; color: #fff; font-size: 11px; opacity: .85;
    text-shadow: 0 1px 2px rgba(0,0,0,.8); transition: right .35s ease; }
  #attrib.shift { right: calc(var(--panel-w) + 12px); }

  @media (max-width: 760px) {
    :root { --panel-w: 100vw; }
    #stage.shift { right: 0; bottom: 55%; }
    #panel { top: 45%; width: 100vw; }
    #attrib.shift { right: 12px; }
    #toc { width: calc(100vw - 24px); }
  }
</style>
</head>
<body>
<div id="stage"><img id="imgA" alt=""><img id="imgB" alt=""></div>

<div id="header"><div class="t" id="hTitle"></div><div class="a" id="hAuthor"></div></div>

<div id="panel" class="hidden">
  <div class="bar">
    <svg class="pin" viewBox="0 0 24 24"><path fill="#fbc02d" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"/><circle cx="12" cy="9" r="2.6" fill="#7a5a00"/></svg>
    <div class="name" id="pName"></div>
  </div>
  <div class="scroll">
    <div class="photo" id="pPhoto"></div>
    <div class="body"><div class="subtitle" id="pSub"></div><div id="pText"></div></div>
  </div>
</div>

<div id="intro"><div class="bg" id="iBg"></div><div class="inner"><h1 id="iTitle"></h1><div id="iText"></div></div></div>

<div id="toc"></div>

<div id="controls">
  <button id="btnToc" title="Table of contents">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    <span>Table of contents</span>
  </button>
  <div class="sep"></div>
  <button class="nav" id="btnPrev" title="Previous"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
  <div class="count" id="count">1/1</div>
  <button class="nav" id="btnNext" title="Next"><svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
</div>

<div id="attrib">Aerial and street views: Google Earth and Google Street View, captured September 2026 &middot; Photographs: Sean Fader</div>

<script src="config.js"></script>
<script src="stops.js"></script>
<script>
(function () {
  const CFG = Object.assign({ stills: 'stills_web', travel: 'map', fade: 900, autoplay: 0, overview: 'photos/overview_map.jpg' }, window.IM_CONFIG || {});
  const DATA = window.IM_DATA;
  const stops = DATA.stops.filter(s => !s.hidden);
  const $ = id => document.getElementById(id);
  document.documentElement.style.setProperty('--fade', CFG.fade + 'ms');

  // ---------- crossfading stage ----------
  const layers = [$('imgA'), $('imgB')];
  let front = 0, seq = 0;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function load(src) {
    return new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src; });
  }
  async function show(src, ms) {
    const back = layers[1 - front];
    if (src) { await load(src); back.src = src; } else { back.removeAttribute('src'); }
    const f = ms != null ? ms : CFG.fade;
    layers.forEach(l => l.style.transitionDuration = f + 'ms');
    back.classList.add('on'); layers[front].classList.remove('on');
    front = 1 - front;
    await sleep(f);
  }
  const stillUrl = s => s.still ? CFG.stills + '/' + s.still : '';

  // ---------- UI ----------
  $('hTitle').textContent = DATA.title; $('hAuthor').textContent = DATA.author;
  const intro = stops[0];
  $('iTitle').textContent = intro.name; $('iText').innerHTML = intro.html;
  if (intro.photo) $('iBg').style.backgroundImage = 'url(' + intro.photo + ')';

  let cur = 0;
  const labelFor = s => s.kind === 'street' ? (s.for || s.name) + ' — street level' : s.name;
  const toc = $('toc');
  const pinSvg = '<svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>';
  const eyeSvg = '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>';
  stops.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'item'; el.dataset.i = i;
    el.innerHTML = '<span class="n">' + (i + 1) + '</span>' + (s.kind === 'street' ? eyeSvg : pinSvg) +
      '<span class="lbl' + (s.kind === 'street' ? ' street' : '') + '">' + (i === 0 ? s.name + ' (introduction)' : labelFor(s)) + '</span>';
    el.addEventListener('click', () => { go(i); toc.classList.remove('open'); });
    toc.appendChild(el);
  });

  function renderPanel(s) {
    $('pName').textContent = s.name;
    const ph = $('pPhoto');
    if (s.photo) { ph.className = 'photo'; ph.innerHTML = '<img src="' + s.photo + '" alt="">'; }
    else { ph.className = 'photo placeholder'; ph.innerHTML = ''; }
    $('pSub').textContent = s.subtitle || '';
    $('pSub').style.display = s.subtitle ? '' : 'none';
    let html = s.html || '';
    if (s.subtitle) html = html.replace(/^<p>.*?<\/p>/s, '');
    $('pText').innerHTML = html;
    $('panel').querySelector('.scroll').scrollTop = 0;
  }
  function setPanel(open) {
    $('panel').classList.toggle('hidden', !open);
    $('stage').classList.toggle('shift', open);
    $('attrib').classList.toggle('shift', open);
  }

  async function go(i) {
    const prev = stops[cur];
    cur = Math.max(0, Math.min(stops.length - 1, i));
    const s = stops[cur];
    const my = ++seq;
    $('count').textContent = (cur + 1) + '/' + stops.length;
    toc.querySelectorAll('.item').forEach(el => el.classList.toggle('current', +el.dataset.i === cur));
    history.replaceState(null, '', '#' + (cur + 1));
    scheduleAutoplay();

    if (s.kind === 'intro') {
      $('intro').classList.remove('hidden'); setPanel(false);
      await show(CFG.overview, 600);
      return;
    }
    $('intro').classList.add('hidden');
    // travelling to a new site: pass through the overview map (or black), like Earth pulling back before it dives in
    const newSite = s.kind === 'story' || !prev || prev.kind === 'intro' || (prev.kind === 'street' && s.kind === 'street');
    if (newSite && prev !== s && CFG.travel !== 'cross') {
      setPanel(false);
      await show(CFG.travel === 'map' ? CFG.overview : '', 600);
      if (my !== seq) return;
      await sleep(350);
      if (my !== seq) return;
    }
    if (s.kind === 'story') { renderPanel(s); setPanel(true); } else { setPanel(false); }
    await show(stillUrl(s));
    // warm the next image
    const nxt = stops[cur + 1]; if (nxt && nxt.still) load(stillUrl(nxt));
  }

  // ---------- autoplay for the gallery ----------
  let apTimer = null, pausedUntil = 0;
  function scheduleAutoplay() {
    clearTimeout(apTimer);
    if (!CFG.autoplay) return;
    const wait = Math.max(CFG.autoplay * 1000, pausedUntil - Date.now());
    apTimer = setTimeout(() => go(cur + 1 < stops.length ? cur + 1 : 0), wait);
  }
  function interacted() { pausedUntil = Date.now() + 60000; scheduleAutoplay(); }
  ['click', 'keydown', 'touchstart', 'wheel'].forEach(ev => document.addEventListener(ev, interacted, { passive: true }));

  $('btnPrev').addEventListener('click', () => go(cur - 1));
  $('btnNext').addEventListener('click', () => go(cur + 1));
  $('btnToc').addEventListener('click', () => toc.classList.toggle('open'));
  $('intro').addEventListener('click', e => { if (e.target.tagName !== 'A') go(1); });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { go(cur + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { go(cur - 1); e.preventDefault(); }
    if (e.key === 'Escape') toc.classList.remove('open');
  });

  const h = parseInt(location.hash.slice(1), 10);
  go(Number.isFinite(h) ? h - 1 : 0);
  window.IM = { go, stops, cfg: CFG };
})();
</script>
</body>
</html>
